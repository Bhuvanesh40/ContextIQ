name: ContextIQ CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Build & Test RAG Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m py_compile app.py
          python -m py_compile src/rag_pipeline.py
          python -m py_compile src/evaluation/retrieval_evaluator.py
          python -m py_compile src/evaluation/ragas_evaluator.py

      - name: Run Retrieval Evaluator Unit Tests
        run: |
          python src/evaluation/test_retrieval_evaluator.py

      - name: Generate Sample Test Documents
        run: |
          python src/create_sample_pdf.py

      - name: Run End-to-End Local Test Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          # If secret is set in GitHub, execute full end-to-end test
          if [ -n "$GEMINI_API_KEY" ]; then
            python test_end_to_end.py
          else
            echo "GEMINI_API_KEY secret not configured; skipping live LLM inference step."
          fi
